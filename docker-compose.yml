services:
  visitsafe:
    image: visitsafe:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_VISITSAFE_API_URL: '${VITE_VISITSAFE_API_URL:-}'
        VITE_VISITSAFE_API_KEY: '${VITE_VISITSAFE_API_KEY:-}'
    pull_policy: build
    ports:
      - '${HTTP_PORT:-8080}:80'
    restart: unless-stopped
